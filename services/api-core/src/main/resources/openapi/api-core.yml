openapi: 3.1.0
info:
  title: AI Impact Evaluation API Core
  version: 0.1.0
  description: >
    Dashboards API (contract-first — update this spec before implementing endpoint changes;
    engineering standards §5). RBAC is enforced (E8-S1, ADR-0004): all endpoints except the
    auth bridge require a bearer JWT with an appropriate role claim.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/dev-token:
    post:
      operationId: issueDevToken
      summary: Dev/pilot auth bridge — issue a short-lived role-scoped JWT (ADR-0004)
      description: >
        Gated by auth.dev-token-enabled; MUST be disabled in production (OIDC replaces it).
        Every issuance is audited.
      security: []
      parameters:
        - { name: email, in: query, required: true, schema: { type: string } }
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [ADMIN, ENG_LEADER, MANAGER, IC, FINANCE_READONLY] }
      responses:
        "200":
          description: Issued token.
          content:
            application/json:
              schema:
                type: object
                required: [token, role, expiresAt]
                properties:
                  token: { type: string }
                  role: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { description: Unknown role. }
  /audit:
    get:
      operationId: getAuditLog
      summary: Recent audit entries (E8-S3) — ADMIN only
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Audit entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    actorEmail: { type: [string, "null"] }
                    action: { type: string }
                    targetType: { type: string }
                    targetId: { type: [string, "null"] }
                    occurredAt: { type: string, format: date-time }
        "403": { description: Caller is not ADMIN. }
  /metrics/cockpit:
    get:
      operationId: getCockpitMetrics
      summary: Cockpit tiles — daily metric series with per-metric aggregates (PRD E4-S1/E4-S2)
      description: Requires an analytical role (ADMIN, ENG_LEADER, MANAGER, FINANCE_READONLY); IC is denied.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
          description: Trailing window in days.
        - name: scope
          in: query
          required: false
          schema: { type: string, default: "*" }
          description: >
            Repository full name, "*" for the org rollup, or a team id (from GET /teams) for
            the org → team drill-down (E4-S2).
      responses:
        "200":
          description: Metric tiles for the requested scope and window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitResponse" }
        "400":
          description: Invalid parameters (RFC 9457 problem details).
  /metrics/ai-cost-track:
    get:
      operationId: getAiCostTrack
      summary: AI coding-assistant spend, adoption, impact, and ROI (PRD E9, AI-01..AI-05)
      description: >
        Computed from staging.ai_usage_state (Claude Code + GitHub Copilot usage ingested by
        connector-ai-telemetry) and staging.pull_request_state's ai_assisted flag (AI-04/AI-05's
        cycle-time segmentation, detected from PR title/body/labels against known AI co-author
        trailer conventions). Input data is sample data shaped like each vendor's real
        usage-report/PR-payload schema, not a genuine enterprise export yet — see the connector
        README for the swap-in seam. teamAllocationAvailable is always false today: no
        contributor→team identity resolution exists yet for AI-telemetry actor keys. impact/roi
        are null (not present) when the window's AI-assisted or non-AI-assisted PR sample is too
        small to report a meaningful median. Requires an analytical role (ADMIN, ENG_LEADER,
        MANAGER, FINANCE_READONLY); IC is denied.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
          description: Trailing window in days.
      responses:
        "200":
          description: AI spend/adoption for the requested window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiCostTrackResponse" }
  /teams:
    get:
      operationId: listTeams
      summary: List teams for the Cockpit org → team drill-down picker (PRD E4-S2)
      responses:
        "200":
          description: Teams, alphabetical by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, repoCount]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    repoCount: { type: integer, description: Number of repositories mapped to this team. }
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Onboarding checklist and time-to-value instrumentation (PRD E1-S5) — ADMIN/ENG_LEADER only
      description: >
        Every field is derived from staging/mart timestamps already written by the ingestion and
        metrics pipelines — never a manually-maintained flag.
      responses:
        "200":
          description: Current setup readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "403": { description: Caller is not ADMIN or ENG_LEADER. }
  /admin/connectors:
    get:
      operationId: getAdminConnectors
      summary: Connector health for the Admin console (PRD E1-S4/E8) — ADMIN only
      description: >
        Status, last-sync time, and event count per connector, derived from staging.raw_event
        timestamps already written by ingestion — never a manually-maintained status flag. Only
        connectors actually wired into ingestion are listed; connectors named in the PRD but not
        yet built are intentionally absent rather than faked.
      responses:
        "200":
          description: Connector health, one entry per wired connector.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorHealth" }
        "403": { description: Caller is not ADMIN. }
  /admin/connectors/repos:
    post:
      operationId: connectRepo
      summary: Connect a GitHub repo from the Admin console — ADMIN only
      description: >
        Triggers connector-github's backfill for one repo (PRs, commits, workflow runs) — the
        same call a terminal `curl` against the connector's internal endpoint used to make.
        Runs asynchronously (large repos can take several minutes); the Connectors panel's
        event count / last-sync reflects progress, there is no separate job-status endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, repo]
              properties:
                owner: { type: string, example: octocat }
                repo: { type: string, example: hello-world }
      responses:
        "202": { description: Backfill triggered. }
        "400": { description: Missing owner/repo. }
        "403": { description: Caller is not ADMIN. }
    delete:
      operationId: disconnectRepo
      summary: Remove a repo from Cockpit/Admin — ADMIN only
      description: >
        Deletes the repo's rows from the three typed projections (pull_request_state,
        workflow_run_state, pull_request_review_state) and any core.team_repo mapping — NOT
        staging.raw_event, which stays untouched as the immutable audit/replay source of truth.
        Re-connecting the same repo later re-derives the same data; nothing is permanently lost.
      parameters:
        - { name: repo, in: query, required: true, schema: { type: string }, example: octocat/hello-world }
      responses:
        "204": { description: Repo removed. }
        "400": { description: Missing repo. }
        "403": { description: Caller is not ADMIN. }
  /admin/connectors/github-teams:
    post:
      operationId: connectGithubOrgTeams
      summary: Import a GitHub org's teams from the Admin console — ADMIN only
      description: >
        Triggers connector-github's org team import (repos + members), consumed by
        identity-service into core.team/core.team_repo/core.team_member. Async, same pattern
        as connectRepo above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org]
              properties:
                org: { type: string, example: my-org }
      responses:
        "202": { description: Team import triggered. }
        "400": { description: Missing org. }
        "403": { description: Caller is not ADMIN. }
  /admin/teams:
    post:
      operationId: upsertTeam
      summary: Create (or rename/re-parent) a manually-defined team — ADMIN only
      description: >
        Teams created here are tagged source='manual', kept separate from any team a real
        GitHub org sync (POST /admin/connectors/github-teams above) would upsert under
        source='github' — both feed the same core.team table and Teams drill-down/DORA rollups.
        Idempotent on team name (a slug derived from it): calling again with the same name
        updates that team in place rather than creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Platform Team }
                parentTeamId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: The team's id.
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string, format: uuid } }
        "403": { description: Caller is not ADMIN. }
  /admin/teams/{teamId}/repos:
    get:
      operationId: listTeamRepos
      summary: List repos mapped to a team — ADMIN only
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Repo full names (owner/repo) mapped to this team.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
    post:
      operationId: addTeamRepo
      summary: Map a repo to a team — ADMIN only
      description: Idempotent — mapping the same repo to the same team twice is a no-op.
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties: { repo: { type: string, example: octocat/hello-world } }
      responses:
        "200":
          description: The team's repo list after the addition.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "403": { description: Caller is not ADMIN. }
    delete:
      operationId: removeTeamRepo
      summary: Unmap a repo from a team — ADMIN only
      description: >
        repo is a query param, not a path segment — a real repo name ("owner/repo") contains a
        slash, which a single path variable can't hold without hitting Tomcat's encoded-slash
        rejection.
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: repo, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The team's repo list after the removal.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "403": { description: Caller is not ADMIN. }
  /admin/teams/{teamId}:
    delete:
      operationId: deleteTeam
      summary: Delete a team — ADMIN only
      description: >
        Cascades this team's own core.team_repo/core.team_member mappings, but blocks (409)
        rather than silently cascading if any core.app_user is pinned to this team via team_id
        (a MANAGER account would otherwise fall back to org-wide scope on their next login — a
        silent privilege change) or if any other team references this one as its parent. Audited
        as TEAM_DELETED.
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Team deleted. }
        "403": { description: Caller is not ADMIN. }
        "404": { description: No team with that id. }
        "409": { description: Team has dependent users or sub-teams — response body explains which. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT with a `role` claim (ADR-0004).
  schemas:
    AiCostTrackResponse:
      type: object
      required: [windowLabel, windowDays, kpis, spendByTool, spendTrend, dailySpend,
                 developerAllocation, teamAllocationAvailable, assumptions]
      properties:
        windowLabel: { type: string }
        windowDays: { type: integer }
        kpis:
          type: object
          required: [totalSpend, costPerPr, costPerDevDay, adoptionRate]
          properties:
            totalSpend: { type: number }
            costPerPr: { type: number, description: "0 when no AI-attributed PRs (commits_by_claude_code-only tools don't divide by zero)." }
            costPerDevDay: { type: number }
            adoptionRate: { type: number, description: "distinct active AI-tool users / assumptions.licensedSeatsAssumed" }
        spendByTool:
          type: array
          items:
            type: object
            required: [tool, monthlySpend]
            properties: { tool: { type: string }, monthlySpend: { type: number } }
        spendTrend:
          type: array
          items:
            type: object
            required: [month, spend, prsAssisted]
            properties: { month: { type: string }, spend: { type: number }, prsAssisted: { type: integer } }
        dailySpend:
          type: array
          items:
            type: object
            required: [date, claudeCode, githubCopilot, cursor]
            properties:
              date: { type: string }
              claudeCode: { type: number }
              githubCopilot: { type: number }
              cursor: { type: number, description: "Always 0 — no Cursor connector yet." }
        developerAllocation:
          type: array
          items:
            type: object
            required: [developer, tool, spend, mergedPrs]
            properties:
              developer: { type: string, description: "Claude Code's actor email or Copilot's user_login — not cross-tool identity-resolved yet." }
              tool: { type: string }
              spend: { type: number }
              mergedPrs: { type: integer, description: "0 for Copilot rows — only Claude Code's usage report tracks PRs." }
        teamAllocationAvailable: { type: boolean, description: "Always false today — see response-level description." }
        impact:
          type: object
          nullable: true
          description: "AI-04. Null when either PR bucket in the window has fewer than 3 merged PRs."
          required: [aiAssistedMedianCycleHours, nonAiMedianCycleHours, aiAssistedPrCount, nonAiPrCount, aiAssistedShare]
          properties:
            aiAssistedMedianCycleHours: { type: number }
            nonAiMedianCycleHours: { type: number }
            aiAssistedPrCount: { type: integer }
            nonAiPrCount: { type: integer }
            aiAssistedShare: { type: number, description: "aiAssistedPrCount / (aiAssistedPrCount + nonAiPrCount)" }
        roi:
          type: object
          nullable: true
          description: "AI-05. Null when impact is null or totalSpend is 0. Can be negative."
          required: [estimatedHoursSaved, dollarValueRecovered, roiMultiple, blendedHourlyRateUsd]
          properties:
            estimatedHoursSaved: { type: number }
            dollarValueRecovered: { type: number }
            roiMultiple: { type: number, description: "dollarValueRecovered / kpis.totalSpend" }
            blendedHourlyRateUsd: { type: number }
        assumptions:
          type: object
          required: [copilotMonthlySeatCostUsd, licensedSeatsAssumed, blendedHourlyRateUsd, methodologyNote]
          properties:
            copilotMonthlySeatCostUsd: { type: number }
            licensedSeatsAssumed: { type: integer }
            blendedHourlyRateUsd: { type: number }
            methodologyNote: { type: string }
    CockpitResponse:
      type: object
      required: [asOf, windowDays, scope, tiles]
      properties:
        asOf:
          type: string
          format: date-time
          description: Freshness indicator — most recent mart computation time in scope (null when no data).
        windowDays: { type: integer }
        scope: { type: string }
        tiles:
          type: array
          items: { $ref: "#/components/schemas/CockpitTile" }
    CockpitTile:
      type: object
      required: [metricKey, label, unit, aggregation, aggregate, sampleSize, series]
      properties:
        metricKey:
          type: string
          enum: [deployment_frequency, lead_time_p50_hours, change_failure_rate, mttr_p50_hours, pr_velocity, pr_cycle_time_p50_hours]
        label: { type: string }
        unit: { type: string }
        aggregation:
          type: string
          enum: [sum, latest, rate]
          description: >
            How `aggregate` was derived from the series: sum for counts, latest for daily
            percentiles, rate for sample-weighted ratios (e.g. change failure rate).
        aggregate:
          type: [number, "null"]
          description: Headline value for the tile over the window; null when no data.
        sampleSize: { type: integer }
        definition:
          type: string
          description: Plain-language metric definition (metric transparency requirement).
        series:
          type: array
          items:
            type: object
            required: [day, value]
            properties:
              day: { type: string, format: date }
              value: { type: number }
    SetupStatus:
      type: object
      required: [checklist, targetMinutes]
      properties:
        checklist:
          type: array
          items:
            type: object
            required: [key, label, done, detail]
            properties:
              key: { type: string, enum: [git, ticketing, ci, dashboard] }
              label: { type: string }
              done: { type: boolean }
              detail: { type: string }
        firstConnectionAt:
          type: [string, "null"]
          format: date-time
          description: Earliest ingested GitHub or Jira event, org-wide.
        firstDashboardAt:
          type: [string, "null"]
          format: date-time
          description: Earliest mart.metric_daily computation, org-wide.
        minutesToValue:
          type: [integer, "null"]
          description: Minutes between firstConnectionAt and firstDashboardAt; null until both exist.
        withinTarget:
          type: [boolean, "null"]
          description: Whether minutesToValue is within the 30-minute time-to-value target.
        targetMinutes: { type: integer, description: The time-to-value target (30, PRD E1-S5). }
    ConnectorHealth:
      type: object
      required: [key, name, type, status, eventCount]
      properties:
        key: { type: string, description: Stable identifier, e.g. "github". }
        name: { type: string, description: Display name, e.g. "GitHub". }
        type: { type: string, description: "Connector category, e.g. \"Git host\", \"CI/CD\", \"Ticketing\"." }
        status:
          type: string
          enum: [CONNECTED, STALE, NOT_CONNECTED]
          description: >
            Derived from lastCheckedAt (V11), not lastDataChangeAt — a connector that runs fine
            but finds nothing new to report must not look stale. CONNECTED = checked within the
            last 24h; STALE = has checked in before but not in 24h; NOT_CONNECTED = never checked.
        lastDataChangeAt:
          type: [string, "null"]
          format: date-time
          description: >
            Most recent event that actually landed a NEW staging.raw_event row (source of "did
            anything change"); null if nothing has ever changed. Distinct from lastCheckedAt —
            an idempotent redelivery/re-check with nothing new to report doesn't move this.
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Most recent time this connector reported in at all, duplicates included (source of
            "is this connector actually working"); null if never connected. staging.connector_activity, V11.
        eventCount: { type: integer, description: Total events ingested for this connector. }
