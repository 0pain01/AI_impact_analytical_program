spring:
  application:
    name: api-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/aiimpacteval}
    username: ${DB_USERNAME:aiimpacteval}
    password: ${DB_PASSWORD:aiimpacteval_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: core
  flyway:
    enabled: true
    schemas: core
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

auth:
  # Dev/pilot bridge that issues role-scoped JWTs (ADR-0004). MUST be false in production,
  # where an OIDC/SSO flow replaces it.
  dev-token-enabled: ${AUTH_DEV_TOKEN_ENABLED:true}

connectors:
  github:
    # Used by ConnectorAdminService to trigger backfill when an ADMIN connects a repo/org from
    # the Admin console — api-core calls the connector's internal endpoint, same as a terminal
    # curl would, just server-to-server.
    base-url: ${CONNECTOR_GITHUB_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
