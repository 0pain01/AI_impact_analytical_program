spring:
  application:
    name: ingestion-writer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/aiimpacteval}
    username: ${DB_USERNAME:aiimpacteval}
    password: ${DB_PASSWORD:aiimpacteval_local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:aiimpacteval}
    password: ${RABBITMQ_PASSWORD:aiimpacteval_local}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai-cost:
  copilot:
    # Copilot's usage export carries no per-request dollar cost (flat-fee seat product) — this is
    # the org-configurable per-seat monthly list price StagingEventWriter allocates across a
    # user's ACTIVE days only (never charged on a day with zero activity). GitHub Copilot
    # Business list price as of writing; override for Enterprise or a negotiated rate.
    monthly-seat-cost-usd: ${COPILOT_MONTHLY_SEAT_COST_USD:19}
