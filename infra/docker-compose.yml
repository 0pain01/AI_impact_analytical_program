name: ai-impact-evaluation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiimpacteval
      POSTGRES_USER: aiimpacteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiimpacteval_local}
    ports:
      # Host port 5442 by default — 5432 commonly taken by other local Postgres instances.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiimpacteval -d aiimpacteval"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aiimpacteval
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
    ports:
      - "5672:5672"
      # Host port 25672 by default — the whole 15476-15975 range falls inside a Windows
      # Hyper-V/WSL dynamic port-exclusion block on some machines, which blocks Docker from
      # binding anywhere in it (see `netsh interface ipv4 show excludedportrange protocol=tcp`).
      # Only the management UI is affected; connectors use AMQP (5672), unaffected.
      - "${RABBITMQ_MGMT_PORT:-25672}:15672"
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Only this connector is containerized so far — see ADR-0005. The others (github, jira,
  # jenkins, ai-telemetry) still run locally via `mvn spring-boot:run` per their READMEs.
  gitlab:
    build:
      context: ../services
      dockerfile: connectors/connector-gitlab/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: aiimpacteval
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_API_BASE_URL: ${GITLAB_API_BASE_URL:-https://gitlab.com/api/v4}
      GITLAB_BACKFILL_DAYS: ${GITLAB_BACKFILL_DAYS:-90}
    ports:
      - "${CONNECTOR_GITLAB_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mqdata:
