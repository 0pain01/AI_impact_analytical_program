name: ai-impact-evaluation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiimpacteval
      POSTGRES_USER: aiimpacteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiimpacteval_local}
    ports:
      # Host port 5442 by default — 5432 commonly taken by other local Postgres instances.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiimpacteval -d aiimpacteval"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aiimpacteval
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
    ports:
      - "5672:5672"
      # Host port 25672 by default — the whole 15476-15975 range falls inside a Windows
      # Hyper-V/WSL dynamic port-exclusion block on some machines, which blocks Docker from
      # binding anywhere in it (see `netsh interface ipv4 show excludedportrange protocol=tcp`).
      # Only the management UI is affected; connectors use AMQP (5672), unaffected.
      - "${RABBITMQ_MGMT_PORT:-25672}:15672"
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # connector-gitlab and connector-jenkins are containerized — see ADR-0005/ADR-0007. The
  # others (github, jira, ai-telemetry) still run locally via `mvn spring-boot:run` per their
  # READMEs.
  gitlab:
    build:
      context: ../services
      dockerfile: connectors/connector-gitlab/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: aiimpacteval
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_API_BASE_URL: ${GITLAB_API_BASE_URL:-https://gitlab.com/api/v4}
      GITLAB_BACKFILL_DAYS: ${GITLAB_BACKFILL_DAYS:-90}
    ports:
      - "${CONNECTOR_GITLAB_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The real Jenkins CI server used for local dev/testing (ADR-0007) — not application code we
  # build, so no Dockerfile of our own, same treatment as postgres/rabbitmq above. Reuses the
  # pre-existing `jenkins_home` named volume (external: true, see below) so job history/config
  # from before this was brought under compose survives unchanged.
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "${JENKINS_PORT:-9090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Backfills Jenkins build history into the shared pipeline (ADR-0007, same containerization
  # template ADR-0005 established for connector-gitlab). JENKINS_BASE_URL points at the `jenkins`
  # service by its compose network name/port, not localhost:9090 (host-only, unreachable from
  # inside this container) — that host-facing default is what connector-jenkins's README/
  # application.yml still use for the "run locally without Docker" path.
  connector-jenkins:
    build:
      context: ../services
      dockerfile: connectors/connector-jenkins/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: aiimpacteval
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
      JENKINS_BASE_URL: http://jenkins:8080
      JENKINS_USERNAME: ${JENKINS_USERNAME:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
    ports:
      - "${CONNECTOR_JENKINS_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mqdata:
  # External: this volume already existed (created by a previously-standalone `jenkins`
  # container run outside compose) and holds real job history/config — reused as-is, never
  # recreated, so bringing Jenkins under this stack (ADR-0007) doesn't lose it.
  jenkins_home:
    external: true
