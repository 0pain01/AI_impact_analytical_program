name: ai-impact-evaluation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiimpacteval
      POSTGRES_USER: aiimpacteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiimpacteval_local}
    ports:
      # Host port 5442 by default — 5432 commonly taken by other local Postgres instances.
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiimpacteval -d aiimpacteval"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aiimpacteval
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aiimpacteval_local}
    ports:
      - "5672:5672"
      # Host port 25672 by default — the whole 15476-15975 range falls inside a Windows
      # Hyper-V/WSL dynamic port-exclusion block on some machines, which blocks Docker from
      # binding anywhere in it (see `netsh interface ipv4 show excludedportrange protocol=tcp`).
      # Only the management UI is affected; connectors use AMQP (5672), unaffected.
      - "${RABBITMQ_MGMT_PORT:-25672}:15672"
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Neither connector is containerized anymore — see ADR-0008 (supersedes ADR-0005/ADR-0007).
  # Both connector-gitlab and connector-jenkins now run as plain processes via
  # infra/start-backend.sh, same as connector-github/jira/ai-telemetry. Their Dockerfiles are
  # kept for reference but are no longer built by this stack.
  #
  # The real Jenkins CI server used for local dev/testing (still containerized — it's not
  # application code we build, same treatment as postgres/rabbitmq above) is the one real
  # dependency connector-jenkins has; it's reachable from a plain-process connector-jenkins at
  # http://localhost:9090 (see infra/start-backend.sh), no compose network needed. Reuses the
  # pre-existing `jenkins_home` named volume (external: true, see below) so job history/config
  # from before this was brought under compose survives unchanged.
  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "${JENKINS_PORT:-9090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  mqdata:
  # External: this volume already existed (created by a previously-standalone `jenkins`
  # container run outside compose) and holds real job history/config — reused as-is, never
  # recreated, so bringing Jenkins under this stack (ADR-0007) doesn't lose it.
  jenkins_home:
    external: true
